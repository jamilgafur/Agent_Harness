name: harness

services:
  core:
    image: harness:latest
    build: .
    command: uvicorn harness.core:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    ports: ["${PORT:-8100}:8000"]
    volumes:
      - data:/data
      - ./harness.toml:/app/harness.toml:ro
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      MODEL: ${MODEL:-qwen2.5:3b}
      SANDBOX_URL: http://sandbox:8001
      CORE_URL: http://core:8000
      HARNESS_CONFIG: ${HARNESS_CONFIG:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [sandbox]

  sandbox:
    image: harness:latest
    build: .
    command: uvicorn harness.sandbox:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - workspace:/workspace
    environment:
      WORKSPACE: /workspace
      SEARX_URL: ${SEARX_URL:-http://host.docker.internal:8095}
    extra_hosts: ["host.docker.internal:host-gateway"]

  agent:
    image: harness:latest
    build: .
    command: python -m harness.agent
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      MODEL: ${MODEL:-qwen2.5:3b}
      CORE_URL: http://core:8000
      HARNESS_CONFIG: ${HARNESS_CONFIG:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [core]
    deploy:
      replicas: 1

  # --- optional local LLM (opt-in): docker compose --profile local-ollama up ---
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ollama"]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_NUM_CTX: "4096"          # 6GB VRAM budget on this box
      OLLAMA_KEEP_ALIVE: 30m
    deploy:
      resources:
        limits:
          memory: 8G # was uncapped — models spill to RAM past the 6GB VRAM budget
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # internal-only: host :11434 belongs to the remote-aistack relay

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-ollama"]
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull $$MODEL"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${MODEL:-qwen2.5:3b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  data:
  workspace:
  ollama_models:
