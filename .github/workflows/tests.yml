name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff
        run: ruff check harness tests

  tests:
    runs-on: ubuntu-latest
    # 3.12 is the supported target (Dockerfile; networkx>=3.5 requires >=3.11)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: pytest
        run: pytest -q

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: pip-audit (known vulnerabilities in pinned deps)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt --strict

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build the image (validates Dockerfile + .dockerignore)
        run: docker build -t harness:ci .
