<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Harness</title>
<style>
  :root { --bg:#0b0f14; --panel:#12181f; --line:#2b333c; --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; }
  * { box-sizing:border-box; font:13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input, textarea, .chip, .tab, #log, #detail { font-family:ui-monospace,SFMono-Regular,monospace; }
  body { margin:0; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:14px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; background:var(--panel); position:sticky; top:0; z-index:5; }
  h1 { font-size:15px; margin:0; }
  .chip { padding:2px 9px; border-radius:10px; border:1px solid var(--line); font-size:12px; color:var(--dim); }
  .chip.attn { color:#e3b341; border-color:#e3b341; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 14px; }
  details.dev summary { cursor:pointer; color:var(--dim); user-select:none; }
  details.dev[open] summary { margin-bottom:8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, input, textarea { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
  button { cursor:pointer; } button:hover { border-color:#58a6ff; }
  textarea { width:100%; min-height:64px; font-size:12px; }
  .tabbtn.on { border-color:#58a6ff; color:#58a6ff; }
  #viewport { position:relative; height:52vh; min-height:340px; border:1px solid var(--line); border-top:none; overflow:hidden; background:
      radial-gradient(circle, #1d2530 1px, transparent 1px) 0 0/24px 24px, var(--bg); cursor:grab; margin:0 14px; border-radius:0 0 8px 8px; }
  #viewport:active { cursor:grabbing; }
  #canvas { position:absolute; inset:0; width:100%; height:100%; }
  .node rect { fill:#161d26; stroke:#8b949e; stroke-width:1.4; rx:8; }
  .node text { fill:var(--fg); font-size:11px; pointer-events:none; }
  .node .sub { fill:var(--dim); font-size:9.5px; }
  .node { cursor:pointer; }
  .node.RUNNING rect { stroke:#58a6ff; stroke-width:2; animation:pulse 1.4s infinite; }
  .node.DONE rect { stroke:#3fb950; } .node.PENDING rect { stroke:#8b949e; }
  .node.WAITING rect { stroke:#d29922; } .node.REPAIRING rect { stroke:#e3b341; stroke-dasharray:5 3; }
  .node.FAILED rect, .node.BLOCKED rect { stroke:#f85149; }
  .node.ESCALATED rect { stroke:#bc4cf0; }
  .node.needsApproval rect { animation:flash 1s infinite; }
  @keyframes pulse { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:.35} }
  @keyframes flash { 0%,100%{stroke:#e3b341; stroke-width:1.8} 50%{stroke:#ffd757; stroke-width:4} }
  .nw.born { animation:pop .45s ease; }
  @keyframes pop { from { opacity:0; transform:scale(.55); } }
  .edge { fill:none; stroke:#3b4654; stroke-width:1.6; }
  .edge.done { stroke:#3fb95066; }
  .edge.born { stroke-dasharray:700; stroke-dashoffset:700; animation:dashin .6s ease forwards; }
  @keyframes dashin { to { stroke-dashoffset:0; } }
  .agent { pointer-events:none; }
  .agent circle { fill:#0b0f14; stroke-width:2.2; }
  .agent text { fill:var(--fg); font-size:10px; font-weight:bold; }
  .agent .ph { font-size:9px; fill:var(--dim); }
  .agent.needhelp .q { fill:#e3b341; font-size:15px; font-weight:bold; }
  .trail { fill:none; stroke-width:2.4; pointer-events:none; opacity:.55; }
  #log { height:130px; overflow:auto; font-size:12px; }
  #log div { padding:1px 4px; border-radius:4px; }
  #log .warn { color:#e3b341; } #log .error { color:#f85149; }
  #detail { white-space:pre-wrap; font-size:11.5px; color:var(--dim); max-height:220px; overflow:auto; }
  #modal { position:fixed; inset:0; background:#0009; display:none; align-items:center; justify-content:center; z-index:10; }
  #modal .card { width:min(720px,92vw); max-height:86vh; overflow:auto; border-radius:12px; box-shadow:0 14px 44px #000b; }
  .agrow { display:flex; gap:10px; flex-wrap:wrap; }
  .acard { border:1px solid var(--line); border-radius:8px; padding:6px 10px; min-width:150px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  /* ---------- n8n-style node cards ---------- */
  .node .card { fill:#1a2230; stroke:#2f3946; stroke-width:1.2; filter:drop-shadow(0 3px 6px #0007); rx:10; }
  .node:hover .card { stroke:#58a6ff; }
  .node .rail { rx:3; }
  .node .port { fill:#0b0f14; stroke:#6e7c8e; stroke-width:1.6; }
  .node .icon { font-size:19px; }
  .node .t1 { fill:var(--fg); font-size:11.5px; font-weight:bold; }
  .node .t2 { fill:var(--fg); font-size:11px; opacity:.85; }
  .node .bdg circle { fill:#e3b341; }
  .node .bdg text { fill:#111; font-size:11px; font-weight:bold; }
  .node.DONE .rail { fill:#3fb950; } .node.DONE .port.out { fill:#3fb950; stroke:#3fb950; }
  .node.RUNNING .rail { fill:#58a6ff; animation:railpulse 1.4s infinite; }
  .node.WAITING .rail { fill:#d29922; }
  .node.REPAIRING .rail { fill:#e3b341; }
  .node.FAILED .rail, .node.BLOCKED .rail { fill:#f85149; }
  .node.ESCALATED .rail { fill:#bc4cf0; }
  .node.PENDING .rail { fill:#6e7c8e; }
  .node.RUNNING .card { stroke:#58a6ff; }
  .node.needsApproval .card { animation:flash 1s infinite; }
  .node.needsApproval .bdg { animation:bob 1s infinite; }
  .resdot { fill:#3fb950; }
  .outnode { cursor:pointer; }
  .outnode .card { fill:#142018; stroke:#3fb95088; }
  .outnode:hover .card { stroke:#3fb950; }
  @keyframes railpulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
  /* ---------- n8n-style run tabs ---------- */
  #tabbar { display:flex; gap:2px; align-items:flex-end; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:37px; z-index:5; }
  .tab { display:inline-flex; align-items:center; gap:2px; border:1px solid transparent; border-bottom:none; background:transparent; color:var(--dim);
         border-radius:8px 8px 0 0; padding:7px 12px 6px; font-size:12px; max-width:300px;
         overflow:hidden; white-space:nowrap; cursor:pointer; }
  .tab:hover { color:var(--fg); background:#161d26; }
  .tab.on { color:var(--fg); background:var(--bg); border-color:var(--line); position:relative; margin-bottom:-1px; padding-bottom:7px; }
  .tab .tlabel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; display:inline-flex; align-items:center; }
  .tab .tdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; flex-shrink:0; }
  .tab .tdel { margin-left:10px; padding:0 6px; border-radius:6px; color:#f85149; opacity:.75; font-weight:bold; flex-shrink:0; }
  .tab .tdel:hover { opacity:1; background:#f8514926; }
  .tab.plus { color:#58a6ff; font-size:15px; padding:6px 11px; }
  .dot.on { background:#3fb950; } .dot.off { background:#555; }
</style>
</head>
<body>
<header>
  <h1>⛓ Agent Harness</h1>
  <span class="chip" id="health">…</span>
  <span class="chip" id="attention"></span>
  <span class="chip" id="agentcount"></span>
  <span class="chip" id="metrics" title="TSR · avg latency · delegation depth · first-pass"></span>
  <span class="chip"><button onclick="fit()">fit all</button><button onclick="zoom(1.25)">+</button><button onclick="zoom(0.8)">−</button></span>
  <button onclick="showHelp()" title="how this works" style="font-size:14px;padding:4px 11px">ⓘ</button>
</header>

<div id="tabbar"><span id="tabs" style="display:flex;overflow-x:auto;flex:1"></span><button class="tab" onclick="showKnowledge()" title="accumulated knowledge tree of the selected run">🌳 knowledge</button><button class="tab" onclick="showOutput()" title="results of the selected run">📄 output</button><button class="tab plus" onclick="newRun()" title="new run">＋</button></div>

<div class="panel" id="planbar" style="display:none;margin:8px 14px 0"></div>
<div id="viewport"><svg id="canvas"><g id="world"></g><g id="agentlayer"></g></svg></div>
<div class="panel"><b>Node</b> <span id="detailhint" class="chip">click a node</span><div id="detail"></div></div>
<div class="panel"><b>Workspace files</b> <button onclick="loadFiles()">refresh</button> <span class="chip" id="filespath"></span>
  <div id="files" class="row" style="max-height:110px;overflow:auto;margin-top:6px"></div></div>
<details class="panel dev"><summary>🛠 developer — live agents &amp; event log (debug)</summary>
  <div class="agrow" id="agents" style="margin-bottom:8px"></div>
  <b>Events</b><div id="log"></div>
</details>

<div id="modal"><div class="panel card"><div id="modalbody"></div></div></div>

<script>
// ---------- state ----------
let RUN=null, ALL={}, AGENTS={}, WS=null;      // ALL: run_id -> {intent,created,nodes,stats,active,pending:Set}
let FOREST={};                                  // run_id -> {pos:{nid:{x,y}}, yOff, h}  (set by draw)
const SEEN=new Set(), POSPREV={}, AGPOS={}, ANIM={};
let view={x:40,y:30,k:1}; const W=228,H=64,CW=320,RH=88;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(m,p,b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({})); if(!r.ok){logLine({level:'error',msg:`${m} ${p}: ${JSON.stringify(j.detail??j)}`}); throw new Error(r.status);} return j;};

// ---------- boot / ws ----------
async function boot(){
  const h=await api('GET','/health'); $('health').textContent=`core ✓ ollama ${h.ollama?'✓':'✗'}`;
  await refreshRuns(); ws(); loadFiles(); requestAnimationFrame(tick);
}
function ws(){
  const s=new WebSocket(`ws://${location.host}/ws`); WS=s;
  s.onmessage=ev=>{const m=JSON.parse(ev.data);
    if(m.type==='state'){ const r=ALL[m.run_id]||(ALL[m.run_id]={});
      r.nodes=m.nodes; r.stats=m.stats; r.active=m.active; r.pending=new Set(m.pending||[]);
      r.phase=m.phase; r.constraints=m.constraints||[]; r.plan_ready=m.plan_ready;
      r.prompts=m.prompts||{}; r.params=m.params||{}; r.warnings=m.warnings||[];
      drawTabs(); planBar(); attention(); if(m.run_id===RUN){draw(); loadFiles();} }
    if(m.type==='agents'){AGENTS=m.agents; drawAgentsPanel(); attention();}
    if(m.type==='log'){ if(m.event.run_id===RUN) logLine(m.event); }
    if(m.type==='approval'){ attention(); const r=ALL[m.approval.run_id];
      if(r){ r.pending=r.pending||new Set();
        m.approval.status==='pending'?r.pending.add(m.approval.node_id):r.pending.delete(m.approval.node_id); draw(); } }
    if(m.type==='run'){ refreshRuns(); }
    if(m.type==='run_deleted'){ delete ALL[m.run_id]; if(RUN===m.run_id){RUN=null;$('detail').textContent='';} refreshRuns(); }
  };
  s.onclose=()=>setTimeout(ws,3000);
}
async function refreshRuns(){
  const runs=await api('GET','/runs');
  const ids=new Set(runs.map(r=>r.id));
  for(const r of runs.slice(0,12)){
    const s=await api('GET',`/runs/${r.id}`);
    ALL[r.id]={intent:r.intent,created:r.created,nodes:s.nodes,stats:s.stats,active:s.active,
               phase:s.phase,constraints:s.constraints||[],plan_ready:s.plan_ready,
               prompts:s.prompts||{},params:s.params||{},warnings:s.warnings||[],
               pending:new Set(s.pending||[])};
  }
  for(const id of Object.keys(ALL)) if(!ids.has(id)) delete ALL[id];
  if(!RUN&&runs[0]) RUN=runs[0].id;
  if(RUN&&!ALL[RUN]) RUN=runs[0]?runs[0].id:null;
  drawTabs(); planBar();
  if(RUN){ $('log').innerHTML=''; (await api('GET',`/runs/${RUN}/events`)).forEach(logLine); draw(); fit(); }
  const m=await api('GET','/metrics');
  const t=m.total;
  $('metrics').textContent=t.tsr_pct===null?'no finished runs'
    :`TSR ${t.tsr_pct}% · ${(t.avg_latency_ms/1000).toFixed(0)}s · depth ${t.max_delegation_depth} · 1st-pass ${t.first_pass_pct}%`;
  attention();
}
function drawTabs(){
  $('tabs').innerHTML=Object.entries(ALL).sort((a,b)=>(b[1].created||0)-(a[1].created||0)).map(([rid,r])=>{
    const nodes=Object.values(r.nodes||{}), total=nodes.length, done=nodes.filter(n=>n.state==='DONE').length;
    const pend=(r.pending||new Set()).size, esc_=nodes.filter(n=>n.state==='ESCALATED').length;
    const color=r.plan_ready?'#e3b341':r.phase==='planning'?'#8b949e':pend+esc_?'#e3b341':r.active?'#58a6ff':(done===total&&total?'#3fb950':'#8b949e');
    return `<span class="tab ${rid===RUN?'on':''}" title="${esc(r.intent||'')}">
      <span class="tlabel" onclick="selRun('${rid}')"><span class="tdot" style="background:${color}"></span>${r.phase==='planning'?'📋 ':''}${esc(rid)} · ${esc((r.intent||'').slice(0,26))} · ${done}/${total}${r.active||r.phase==='planning'?'':' ✓'}</span>
      <span class="tdel" title="delete run" onclick="delRun('${rid}')">✕</span></span>`;
  }).join('');
}

// ---------- plan checkpoint bar (plan first, user approves, then bottom-up) ----------
let PLANBAR_KEY='';
function planBar(){
  const r=ALL[RUN], bar=$('planbar');
  if(!r||r.phase!=='planning'){ bar.style.display='none'; PLANBAR_KEY=''; return; }
  bar.style.display='block';
  const n=Object.keys(r.nodes||{}).length;
  const gated=Object.values(r.nodes||{}).filter(x=>!x.tool&&x.state==='PENDING'&&
     (x.deps||[]).some(d=>(r.nodes[d]||{}).tool)).length;
  // re-render only when something meaningful changed — the input must keep focus
  const key=RUN+'|'+n+'|'+gated+'|'+r.plan_ready+'|'+(r.constraints||[]).join('§')+'|'+JSON.stringify(r.prompts||{})+JSON.stringify(r.params||{});
  if(key===PLANBAR_KEY) return;
  PLANBAR_KEY=key;
  const pr=r.prompts||{}, pa=r.params||{};
  const cfHtml=`
    <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--dim)">⚙ prompts &amp; parameters (advanced)</summary>
    <div style="margin-top:6px;color:var(--dim);font-size:11.5px">blank = built-in default · applies to everything decomposed/written after saving</div>
    <div style="margin-top:4px;color:var(--dim);font-size:11px">decompose prompt</div>
    <textarea id="p_decompose" placeholder="default (built-in)" style="min-height:40px">${esc(pr.decompose||'')}</textarea>
    <div style="margin-top:4px;color:var(--dim);font-size:11px">synthesize prompt</div>
    <textarea id="p_synthesize" placeholder="default (built-in)" style="min-height:40px">${esc(pr.synthesize||'')}</textarea>
    <div style="margin-top:4px;color:var(--dim);font-size:11px">judge prompt</div>
    <textarea id="p_judge" placeholder="default (built-in)" style="min-height:40px">${esc(pr.judge||'')}</textarea>
    <div class="row" style="margin-top:6px">
      <input id="pm_model" placeholder="default (env MODEL)" value="${esc(pa.model||'')}" title="model" style="min-width:150px">
      <input id="pm_temperature" type="number" min="0" max="1" step="0.05" placeholder="temperature" title="temperature 0..1" value="${pa.temperature??''}" style="width:110px">
      <input id="pm_child_cap" type="number" min="1" max="6" placeholder="child cap" title="child cap 1..6" value="${pa.child_cap??''}" style="width:90px">
      <input id="pm_max_results" type="number" min="3" max="10" placeholder="max results" title="max results 3..10" value="${pa.max_results??''}" style="width:100px">
      <input id="pm_gather_tools" placeholder="gather tools, comma-separated" title="gather tools" value="${esc((pa.gather_tools||[]).join(','))}" style="min-width:170px">
      <input id="pm_sink_tool" placeholder="sink tool" title="sink tool" value="${esc(pa.sink_tool||'')}" style="width:100px">
      <button onclick="saveConfig()">save overrides</button>
    </div>
    </details>`;
  const chips=(r.constraints||[]).map((c,i)=>`<span class="chip">${esc(c)} <b style="cursor:pointer;color:#f85149" onclick="delConstraint(${i})" title="remove">✕</b></span>`).join(' ');
  bar.innerHTML=`<b>📋 planning the run — nothing executes until you approve</b>
    <span class="chip">${r.plan_ready?`plan ready · ${n} nodes`:`decomposing… ${n} nodes so far`}</span>
    ${gated?`<span class="chip" title="these branches plan further once their searches return results">${gated} branch${gated===1?'':'es'} refine after results</span>`:''}
    ${(r.warnings||[]).length?`<span class="chip attn" title="${esc(r.warnings.join('\n'))}">⚠ ${r.warnings.length} warning${r.warnings.length===1?'':'s'} — hover</span>`:''}
    <div style="margin-top:8px;color:var(--dim);font-size:12px;line-height:1.6">
      The agents broke your request into atomic steps (the tree below). Review it:
      add constraints or instructions (e.g. <i>ignore methodology</i>, <i>discuss cost</i>),
      <b>＋ add branches</b> (top-level or click a node → <b>add a branch here</b>) — nodes you add are
      reasoned out by the LLM using the neighbor context — ✎ edit intent rewrites any step,
      ✏️ break down further re-plans it. Then start the work.
      It runs <b>bottom-up</b>: leaves gather, each writer condenses its neighbours,
      and the head ends with the answer.</div>
    <div class="row" style="margin-top:8px">
      <input id="consinput" placeholder="add a constraint or instruction…" style="flex:1;min-width:220px;padding:6px 10px"
        onkeydown="if(event.key==='Enter')setConstraints([...(ALL[RUN].constraints||[]),this.value])">
      <button onclick="setConstraints([...(ALL[RUN].constraints||[]),document.getElementById('consinput').value])">add</button>
      ${chips}</div>
    <div class="row" style="margin-top:8px">
      <button style="border-color:#3fb950;color:#3fb950;padding:7px 18px;font-weight:bold" onclick="goRun()" ${r.plan_ready?'':'disabled title="planners still working…"'}>✔ plan is good — start bottom-up execution</button>
      <button onclick="addBranch('root')" title="add a new branch under the head — the LLM fleshes it out from what you type">＋ add a top-level branch</button>
    </div>${cfHtml}`;
}
async function saveConfig(){
  const prompts={}, params={};
  for(const k of ['decompose','synthesize','judge']){ const v=$('p_'+k).value.trim(); if(v) prompts[k]=v; }
  const model=$('pm_model').value.trim(); if(model) params.model=model;
  const t=$('pm_temperature').value; if(t!=='') params.temperature=+t;
  const cc=$('pm_child_cap').value; if(cc!=='') params.child_cap=+cc;
  const mr=$('pm_max_results').value; if(mr!=='') params.max_results=+mr;
  const gt=$('pm_gather_tools').value.trim(); if(gt) params.gather_tools=gt.split(',').map(s=>s.trim()).filter(Boolean);
  const st=$('pm_sink_tool').value.trim(); if(st) params.sink_tool=st;
  await api('PUT',`/runs/${RUN}/config`,{prompts,params});
  PLANBAR_KEY=''; planBar();
}
async function setConstraints(list){
  const clean=[...new Set(list.map(x=>String(x).trim()).filter(Boolean))];
  PLANBAR_KEY='';
  await api('PUT',`/runs/${RUN}/constraints`,{constraints:clean});
  planBar();
}
async function delConstraint(i){
  const r=ALL[RUN]; await setConstraints((r.constraints||[]).filter((_,j)=>j!==i));
}
async function goRun(){ PLANBAR_KEY=''; await api('POST',`/runs/${RUN}/go`); planBar(); }
async function replanNode(rid,nid){
  await api('POST',`/runs/${rid}/nodes/${nid}/replan`);
  $('detail').textContent=''; $('detailhint').textContent='click a node'; draw();
}
function askText(title, placeholder, onok){
  $('modalbody').innerHTML=`<b>${title}</b>
    <div class="row" style="margin-top:8px"><input id="askv" placeholder="${esc(placeholder)}" style="flex:1;min-width:260px;padding:6px 10px"></div>
    <div class="row" style="margin-top:8px"><button id="askok" style="border-color:#58a6ff;color:#58a6ff;padding:6px 16px">ok</button><button onclick="$('modal').style.display='none'">cancel</button></div>`;
  $('modal').style.display='flex';
  const v=$('askv'); v.focus();
  $('askok').onclick=()=>{const t=v.value.trim(); if(t){$('modal').style.display='none'; onok(t);}};
  v.onkeydown=e=>{if(e.key==='Enter')$('askok').click();};
}
function addBranch(parent){
  askText(`＋ new branch under ${parent} — the LLM will break it down using the neighbor context`,
          'e.g. compare vLLM vs TGI for production serving', async text=>{
    await api('POST',`/runs/${RUN}/nodes`,{intent:text,parent});
  });
}
async function editIntent(rid,nid){
  askText(`✎ edit intent — ${nid}`,'refined instruction', async text=>{
    await api('PATCH',`/runs/${rid}/nodes/${nid}`,{intent:text});
    clickNode(nid);
  });
}
function editArgs(rid,nid){
  const n=(ALL[rid].nodes||{})[nid]||{};
  $('modalbody').innerHTML=`<b>⚙ args — ${esc(nid)} <span style="color:var(--dim)">${esc(n.tool||'')}</span></b>
    <textarea id="argedit" style="min-height:220px;margin-top:6px">${esc(JSON.stringify(n.args||{},null,2))}</textarea>
    <div class="row" style="margin-top:8px"><button id="argsave" style="border-color:#58a6ff;color:#58a6ff;padding:6px 16px">save args</button><button onclick="$('modal').style.display='none'">cancel</button></div>`;
  $('modal').style.display='flex';
  $('argsave').onclick=async()=>{ let a; try{a=JSON.parse($('argedit').value);}catch(e){return alert('bad JSON');}
    await api('PATCH',`/runs/${rid}/nodes/${nid}`,{args:a});
    $('modal').style.display='none'; clickNode(nid); };
}
async function selRun(rid){
  if(!ALL[rid]||rid===RUN)return;
  RUN=rid; PLANBAR_KEY=''; $('log').innerHTML=''; $('detail').textContent=''; $('detailhint').textContent='click a node';
  (await api('GET',`/runs/${rid}/events`)).forEach(logLine);
  drawTabs(); planBar(); draw(); fit();
}

// ---------- tidy tree layout (per run) ----------
function layoutRun(r){
  const nodes=Object.values(r.nodes||{}); if(!nodes.length)return {pos:{},h:0};
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const primary=n=>{ if(n.parent&&byId[n.parent])return n.parent;
    const d=n.deps||[]; return d.length&&byId[d[0]]?d[0]:null; };
  const kids={};
  nodes.forEach(n=>{const p=primary(n); if(p)(kids[p]=kids[p]||[]).push(n.id);});
  Object.values(kids).forEach(k=>k.sort());
  const roots=nodes.filter(n=>!primary(n)).map(n=>n.id).sort();
  const pos={}; let nextY=0;
  const place=(id,d)=>{
    const c=kids[id]||[]; let y;
    if(c.length){ const ys=c.map(ch=>place(ch,d+1)); y=(ys[0]+ys[ys.length-1])/2; }
    else { y=nextY*RH; nextY++; }
    pos[id]={x:d*CW,y}; return y;
  };
  roots.forEach(rid=>{place(rid,0); nextY+=0.6;});
  nodes.forEach(n=>{ if(!pos[n.id]){ pos[n.id]={x:(n.depth||0)*CW,y:nextY*RH}; nextY++; } });
  // a node never sits left of its inputs: push each one a column past its deepest
  // dep — converging "synthesis" wires become forward fan-in lanes, not loops
  for(let guard=0;guard<8;guard++){
    let moved=false;
    for(const n of nodes){
      const p=pos[n.id]; if(!p) continue;
      for(const d of n.deps||[]){
        const dp=pos[d];
        if(dp&&dp.x+CW>p.x){p.x=dp.x+CW;moved=true;}
      }
    }
    if(!moved)break;
  }
  return {pos,h:nextY*RH};
}

// ---------- n8n skin helpers ----------
const ICON=n=>n.type==='loop'?'⟳':!n.tool?'✦':n.tool.startsWith('mcp_')?'🔌'
  :({shell:'⌘',write_file:'📄',read_file:'📖',list_dir:'📁',web_search:'🔍',http_fetch:'🌐',llm:'✍️'}[n.tool]||'⚙️');
function clampTitle(s){ s=String(s||''); return [s.slice(0,24), s.length>24 ? s.slice(24,44)+(s.length>44?'…':'') : '']; }

// ---------- draw the selected run ----------
function draw(){
  const r=ALL[RUN]; let html=''; FOREST={};
  if(!r){
    html=`<text x="40" y="60" fill="#8b949e" font-size="14">no runs — hit ＋ to let the AI build one</text>`;
  } else {
    const {pos}=layoutRun(r); FOREST[RUN]={pos,yOff:0};
    for(const n of Object.values(r.nodes||{})){
      const deps=n.deps||[];
      deps.forEach((d,i)=>{
        const p0=pos[d],p1=pos[n.id]; if(!p0||!p1)return;
        const x0=p0.x+W,yy0=p0.y+H/2,x1=p1.x;
        // fan-in: each incoming dep lands on its own slot of the card's left edge
        const yy1=p1.y+H*(0.22+0.56*((i+1)/(deps.length+1)));
        const mx=Math.max(60,Math.abs(x1-x0)/2);
        const ekey=`${d}>${n.id}`, born=!SEEN.has(ekey); SEEN.add(ekey);
        html+=`<path class="edge ${r.nodes[d].state==='DONE'?'done':''} ${born?'born':''}" d="M${x0},${yy0} C${x0+mx},${yy0} ${x1-mx},${yy1} ${x1},${yy1}"/>`;
      });
    }
    for(const n of Object.values(r.nodes||{})){
      const p=pos[n.id]; if(!p)continue;
      const need=(r.pending||new Set()).has(n.id);
      const key=n.id, born=!SEEN.has(key); SEEN.add(key);
      const [t1,t2]=clampTitle(n.intent);
      html+=`<g class="node ${n.state} ${need?'needsApproval':''}" data-nid="${esc(n.id)}" transform="translate(${p.x},${p.y})"><g class="nw ${born?'born':''}">
        <rect class="card" width="${W}" height="${H}"/>
        <rect class="rail" x="0" y="0" width="6" height="${H}"/>
        <circle class="port in" cx="0" cy="${H/2}" r="5"/><circle class="port out" cx="${W}" cy="${H/2}" r="5"/>
        <text class="icon" x="22" y="${H/2+7}">${ICON(n)}</text>
        <text class="t1" x="54" y="24">${esc(t1)}</text>
        <text class="t2" x="54" y="38">${esc(t2)}</text>
        <text class="sub" x="54" y="54">${esc(n.tool||'abstract')} · ${n.state}${n.attempts>1?' ×'+n.attempts:''}${n.hint?' — ⚠ '+esc(n.hint.slice(0,16)):''}</text>
        ${need?`<g class="bdg"><circle cx="${W-16}" cy="6" r="10"/><text x="${W-16}" y="10" text-anchor="middle">!</text></g>`:''}
        ${n.result!=null?`<circle class="resdot" cx="${W-16}" cy="${need?26:6}" r="4" title="has output"/>`:''}
      </g></g>`;
    }
    // virtual RESULTS sink: the run's outputs as a first-class node on the DAG
    const produced=Object.values(r.nodes||{}).filter(n=>n.result!=null);
    const xs=Object.values(pos).map(p=>p.x);
    if(produced.length&&xs.length){
      const consumed=new Set(Object.values(r.nodes).flatMap(n=>[n.parent,...(n.deps||[])].filter(Boolean)));
      const sinks=Object.values(r.nodes).filter(n=>!consumed.has(n.id)&&n.result!=null);
      const ox=Math.max(...xs)+CW;
      const oys=sinks.map(n=>pos[n.id].y);
      const oy=oys.length?(Math.min(...oys)+Math.max(...oys))/2:0;
      FOREST[RUN].pos['$output']={x:ox,y:oy};
      const headAns=!!(r.nodes['root']&&r.nodes['root'].result&&r.nodes['root'].result.text);
      for(const s of sinks.filter(s=>s.id!=='root')){   // head wire would span the whole canvas
        const x0=pos[s.id].x+W,yy0=pos[s.id].y+H/2,mx=Math.max(60,(ox-x0)/2);
        html+=`<path class="edge done" d="M${x0},${yy0} C${x0+mx},${yy0} ${ox-mx},${oy+H/2} ${ox},${oy+H/2}"/>`;
      }
      html+=`<g class="node outnode" data-out="1" transform="translate(${ox},${oy})"><g class="nw">
        <rect class="card" width="${W}" height="${H}"/>
        <rect class="rail" x="0" y="0" width="6" height="${H}" style="fill:#3fb950"/>
        <circle class="port in" cx="0" cy="${H/2}" r="5"/>
        <text class="icon" x="22" y="${H/2+7}">📄</text>
        <text class="t1" x="54" y="24">RESULTS</text>
        <text class="sub" x="54" y="44">${headAns?'the head (leftmost) node holds the answer — click to read':`${produced.length} node${produced.length===1?'':'s'} produced output — click to read`}</text>
      </g></g>`;
    }
  }
  const world=$('world'); world.innerHTML=html;
  world.querySelectorAll('.node:not([data-out])').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();clickNode(el.dataset.nid);}));
  world.querySelectorAll('.node[data-out]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();showOutput();}));
  // FLIP: glide nodes that moved since last layout
  world.querySelectorAll('.node').forEach(el=>{
    const key=el.dataset.nid; if(!key)return;
    const m=/translate\(([-\d.e]+),([-\d.e]+)\)/.exec(el.getAttribute('transform')||'');
    if(!m)return; const nx=+m[1],ny=+m[2], prev=POSPREV[key];
    if(prev&&(Math.abs(prev.x-nx)>1||Math.abs(prev.y-ny)>1))
      el.animate([{transform:`translate(${prev.x}px,${prev.y}px)`},{transform:`translate(${nx}px,${ny}px)`}],
                 {duration:380,easing:'ease-in-out'});
    POSPREV[key]={x:nx,y:ny};
  });
  applyView();
}

// ---------- agents ride edges ----------
function cubicPt(p0,p1,s){
  const dx=Math.abs(p1.x-p0.x)/2+30, c1={x:p0.x+dx,y:p0.y}, c2={x:p1.x-dx,y:p1.y}, u=1-s;
  return {x:u*u*u*p0.x+3*u*u*s*c1.x+3*u*s*s*c2.x+s*s*s*p1.x,
          y:u*u*u*p0.y+3*u*u*s*c1.y+3*u*s*s*c2.y+s*s*s*p1.y};
}
function tick(){ drawAgents(); requestAnimationFrame(tick); }
function drawAgents(){
  const L=$('agentlayer'); if(!L)return;
  for(const [id,a] of Object.entries(AGENTS)){
    if(!a.node_id||!FOREST[a.run_id])continue;
    const f=FOREST[a.run_id], p=f.pos[a.node_id]; if(!p)continue;
    const t={x:p.x+W-34,y:p.y+f.yOff-24};
    const prev=AGPOS[id];
    if(!prev||Math.abs(prev.x-t.x)>1||Math.abs(prev.y-t.y)>1)
      ANIM[id]={p0:prev?{...prev}:t,p1:t,t0:performance.now(),dur:650};
  }
  for(const [id,an] of Object.entries(ANIM)){
    const e=Math.min(1,(performance.now()-an.t0)/an.dur), s=e<.5?2*e*e:-1+(4-2*e)*e;
    AGPOS[id]=e<1?cubicPt(an.p0,an.p1,s):{...an.p1};
    if(e>=1)delete ANIM[id];
  }
  const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
  L.innerHTML=Object.entries(AGENTS).map(([id,a])=>{
    const g=AGPOS[id]; if(!g)return '';
    const an=ANIM[id]; let trail='';
    if(an){ const e=Math.min(1,(performance.now()-an.t0)/an.dur), s2=Math.max(0,(e<.5?2*e*e:-1+(4-2*e)*e)-0.14);
      const b=cubicPt(an.p0,an.p1,s2);
      trail=`<line class="trail" x1="${b.x+14}" y1="${b.y+14}" x2="${g.x+14}" y2="${g.y+14}" style="stroke:hsl(${hue(id)},70%,55%)"/>`; }
    const need=a.node_id&&ALL[a.run_id]&&(ALL[a.run_id].pending||new Set()).has(a.node_id);
    return `${trail}<g class="agent ${need?'needhelp':''}" style="transform:translate(${g.x}px,${g.y}px)">
      <circle cx="14" cy="14" r="13" style="stroke:${a.alive?`hsl(${hue(id)},70%,55%)`:'#555'}"/>
      <text x="14" y="18" text-anchor="middle">${esc(id.replace(/^agent-?/,'')[0]||'A').toUpperCase()}</text>
      ${need?'<text class="q" x="24" y="4">?</text>':`<text class="ph" x="28" y="20">${esc(a.phase.slice(0,12))}</text>`}</g>`;
  }).join('');
}

// ---------- pan / zoom ----------
let drag=null;
const vp=$('viewport');
vp.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};vp.setPointerCapture(e.pointerId);});
vp.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+(e.clientX-drag.x);view.y=drag.vy+(e.clientY-drag.y);applyView();});
vp.addEventListener('pointerup',()=>drag=null);
vp.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:0.89;zoomAt(f,e.offsetX,e.offsetY);},{passive:false});
function zoomAt(f,cx,cy){const k2=Math.min(3,Math.max(.15,view.k*f));view.x=cx-(cx-view.x)*k2/view.k;view.y=cy-(cy-view.y)*k2/view.k;view.k=k2;applyView();}
function zoom(f){zoomAt(f,vp.clientWidth/2,vp.clientHeight/2);}
function applyView(){$('world').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);$('agentlayer').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function fit(){
  const f=FOREST[RUN]; if(!f)return;
  const xs=[],ys=[];
  for(const p of Object.values(f.pos)){xs.push(p.x);ys.push(p.y);}
  if(!xs.length)return;
  const x0=Math.min(...xs),x1=Math.max(...xs)+W,y0=Math.min(...ys)-30,y1=Math.max(...ys)+H;
  view.k=Math.min(1.3,vp.clientWidth/(x1-x0+60),vp.clientHeight/(y1-y0+40));
  view.x=vp.clientWidth/2-(x0+x1)/2*view.k;
  view.y=vp.clientHeight/2-(y0+y1)/2*view.k;
  applyView();
}

// ---------- result rendering ----------
function renderResult(v){
  if(v==null) return '';
  if(typeof v!=='object') return String(v);
  if(Array.isArray(v.results)&&v.results.length&&v.results[0]&&v.results[0].url!==undefined)
    return v.results.map(x=>`${x.page_text?'📖 page read:':'🔗 link only:'} ${x.title||x.url}\n  ${x.url}`).join('\n');
  if(v.content!==undefined) return String(v.content).slice(0,1500);
  if(v.stdout!==undefined) return (v.stdout+(v.stderr?'\n[stderr] '+v.stderr:'')).slice(0,1500)||'(empty output)';
  if(v.text) return v.text.slice(0,1500);
  if(v.bytes!==undefined) return `wrote ${v.bytes} bytes`;
  if(Object.keys(v).length&&Object.values(v).every(x=>x&&typeof x==='object'))
    return Object.entries(v).map(([k,x])=>`── ${k} ──\n${renderResult(x)}`).join('\n\n').slice(0,2500);
  return JSON.stringify(v,null,1).slice(0,1500);
}

let LASTOUT='';
function headText(r){
  const nodes=r.nodes||{};
  const root=nodes['root'];
  if(root&&root.result&&root.result.text) return root.result.text;   // head owns the answer
  const consumed=new Set(Object.values(nodes).flatMap(n=>[n.parent,...(n.deps||[])].filter(Boolean)));
  const texts=Object.values(nodes).filter(n=>!consumed.has(n.id)&&n.result&&n.result.text);
  if(texts.length) return texts.sort((a,b)=>b.result.text.length-a.result.text.length)[0].result.text;
  return '';
}
// tiny markdown renderer for the assembled head document (escapes first, then marks up)
function mdLite(s){
  let h=esc(s||'');
  h=h.replace(/^### (.*)$/gm,(m,t)=>`<div style="font-weight:bold;margin:10px 0 2px">${t}</div>`);
  h=h.replace(/^## (.*)$/gm,(m,t)=>`<div style="font-weight:bold;font-size:14.5px;margin:16px 0 4px;color:var(--acc)">${t}</div>`);
  h=h.replace(/^# (.*)$/gm,(m,t)=>`<div style="font-weight:bold;font-size:17px;margin:4px 0 10px">${t}</div>`);
  h=h.replace(/\*\*([^*\n]+)\*\*/g,(m,t)=>`<b>${t}</b>`);
  h=h.replace(/^- (https?:\S+?)(&amp;\S+)?(\s*)$/gm,(m,u,a)=>`• <a href="${u+(a||'')}" target="_blank" rel="noopener" style="color:var(--acc)">${u}${a||''}</a>`);
  h=h.replace(/^- (?!\s*<a)(.*)$/gm,'• $1');
  return h;
}
function ktree(k,d){
  const rows=(k.children||[]).map(c=>ktree(c,d+1)).join('');
  const own=k.chars?`<span style="color:var(--mut);font-size:11px">${k.chars}ch</span>
    <div style="color:var(--mut);white-space:pre-wrap;font-size:11.5px">${esc(k.text||'').slice(0,240)}</div>`:'';
  return `<div style="margin-left:${d*18}px;border-left:${d?'1px solid var(--line)':'none'};padding:3px 8px">
    <b style="font-size:12px">${esc(k.id)}</b> · ${esc(k.intent||'')} ${own}</div>`+rows;
}

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(t,null,2)],{type:'application/json'}));
  a.download=`${RUN||'run'}-template.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
async function copyOutput(btn){
  try{ await navigator.clipboard.writeText(LASTOUT); btn.textContent='✓ copied'; setTimeout(()=>btn.textContent='⧉ copy',1200); }
  catch(e){ logLine({level:'error',msg:'clipboard blocked by the browser'}); }
}
async function rerun(){
  const r=ALL[RUN]; if(!r||!r.intent)return;
  $('modal').style.display='none';
  const res=await api('POST','/runs',{intent:r.intent});
  await refreshRuns(); selRun(res.run_id);
}

// ---------- node interactions ----------
async function clickNode(nid){
  const rid=RUN; if(!rid)return;
  const pend=(await api('GET','/approvals?status=pending')).find(a=>a.node_id===nid&&a.run_id===rid);
  if(pend) return openApproval(pend);
  const r=ALL[rid]; if(!r)return; const n=(r.nodes||{})[nid]; if(!n)return;
  $('detailhint').textContent=`${rid} / ${nid}`;
  const stColor={DONE:'#3fb950',RUNNING:'#58a6ff',WAITING:'#d29922',REPAIRING:'#e3b341',
                 FAILED:'#f85149',BLOCKED:'#f85149',ESCALATED:'#bc4cf0',PENDING:'#8b949e'}[n.state]||'#8b949e';
  const rows=[['intent',n.intent],['tool',n.tool||'(planner — LLM decomposes this)'],
      n.success_predicate?['success when',n.success_predicate]:null,
      n.attempts>1?['attempts',n.attempts]:null,
      n.llm_calls?['llm calls',n.llm_calls]:null,
      n.hint?['⚠ hint',n.hint]:null].filter(Boolean);
  $('detail').innerHTML=
    `<div style="margin:4px 0"><span style="background:${stColor}22;color:${stColor};border:1px solid ${stColor};padding:2px 12px;border-radius:10px;font-weight:bold">${n.state}</span></div>
     <table style="border-collapse:collapse">${rows.map(([k,v])=>
       `<tr><td style="color:var(--dim);padding:1px 10px 1px 0;vertical-align:top">${k}</td><td style="color:var(--fg)">${esc(v)}</td></tr>`).join('')}</table>
     ${n.result!=null?`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px;color:var(--fg);white-space:pre-wrap">${esc(renderResult(n.result))}</div>`:''}
     ${r.phase==='planning'&&['PENDING','WAITING'].includes(n.state)
        ?`<div style="margin-top:8px">${n.tool?`<div class="chip" style="margin-bottom:6px">held — runs after you approve the plan</div><br>`:''}
          <button onclick="addBranch('${nid}')" title="add a sub-branch under this node — the LLM reasons it out from the neighbor context">＋ add a branch here</button>
          <button onclick="editIntent('${rid}','${nid}')" title="rewrite this node's instruction">✎ edit intent</button>
          ${n.tool?`<button onclick="editArgs('${rid}','${nid}')" title="edit this node's tool arguments as JSON">⚙ args</button>`:''}
          <button onclick="replanNode('${rid}','${nid}')" title="delete this subtree and let the planner break it down again (against your constraints)">✏️ break down further</button></div>`:''}
     ${['ESCALATED','FAILED'].includes(n.state)?`<div style="margin-top:8px"><button onclick="retry('${rid}','${nid}')">fix &amp; retry</button></div>`:''}`;
}
async function retry(rid,nid){await api('POST',`/runs/${rid}/patch`,{ops:[{op:"retry_node",node_id:nid}],reason:"user fix"});}
function openApproval(a){
  let summary;
  if(a.kind==='patch'){
    summary=`<div style="color:var(--dim);margin:4px 0">the agent wants to split <b style="color:var(--fg)">${esc(a.node_id)}</b> into these subtasks:</div>`+
      (a.args.children||[]).map((c,i)=>`<div style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 0">
        <b>${i+1}. ${esc(c.intent||'')}</b>
        <div style="color:var(--dim);font-size:11.5px;margin-top:2px">tool: <b>${esc(c.tool||'planner')}</b>
        ${c.deps&&c.deps.length?` · after step ${c.deps.map(d=>d+1).join(', ')}`:''}
        ${c.success_predicate?` · done when: ${esc(c.success_predicate)}`:''}</div></div>`).join('');
  } else {
    summary=`<div style="color:var(--dim);margin:4px 0">the agent wants to run:</div>
      <div style="border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 0">
        <b>${esc(a.tool)}</b><div style="color:var(--dim);font-size:11.5px;margin-top:3px;white-space:pre-wrap">${esc(renderResult(a.args))}</div></div>`;
  }
  const editable=a.kind==='patch'?{children:a.args.children}:a.args;
  $('modalbody').innerHTML=`<b>⏸ next step needs your OK — ${esc(a.node_id)}</b>
    ${summary}
    <details style="margin:6px 0"><summary style="cursor:pointer;color:var(--dim)">edit the plan as JSON (advanced)</summary>
      <textarea id="modargs" style="min-height:160px;margin-top:4px">${esc(JSON.stringify(editable,null,2))}</textarea></details>
    <div class="row" style="margin-top:8px">
      <button style="border-color:#3fb950;color:#3fb950;padding:7px 18px" onclick="decide('${a.id}',true)">✔ approve — go ahead</button>
      <button style="border-color:#f85149;color:#f85149;padding:7px 18px" onclick="decide('${a.id}',false)">✖ reject — rethink</button>
      <button onclick="$('modal').style.display='none'">later</button></div>`;
  $('modal').style.display='flex';
}
async function decide(id,ok){
  let args;
  const ta=$('modargs');
  if(ok){ try{args=JSON.parse(ta.value);}catch(e){return alert('bad JSON');} }
  const body = ok ? {decision:'approve',args} : {decision:'reject'};
  const r=await api('POST',`/approvals/${id}`,body);
  logLine({level:r.status==='done'?'info':'warn',msg:`approval ${id}: ${r.status}`});
  $('modal').style.display='none'; attention();
}

// ---------- new run ----------
let RUNTAB=0;
function newRun(){
  $('modalbody').innerHTML=`<b>new run</b>
    <div class="row" style="margin:8px 0"><button class="tabbtn on" id="tabintent" onclick="runTab(0)">intent (LLM decomposes)</button><button class="tabbtn" id="tabtpl" onclick="runTab(1)">template DAG</button></div>
    <textarea id="rtext" style="min-height:150px"></textarea>
    <div class="row" id="examples" style="margin-top:6px">
      <button onclick="$('rtext').value=this.dataset.v" data-v="tell me about the difference between structured and unstructured pruning of neural networks">tell me about pruning</button>
      <button onclick="$('rtext').value=this.dataset.v" data-v="write a short research paper on mixture-of-experts routing in transformers, with references">research paper on MoE</button>
      <button onclick="$('rtext').value=this.dataset.v" data-v="research the main approaches to LLM quantization and write a summary with comparisons">LLM quantization survey</button>
    </div>
    <div class="row" style="margin-top:8px"><button onclick="submitRun()">create run</button><button onclick="$('modal').style.display='none'">cancel</button>
    <span class="chip" id="runhint"></span></div>`;
  runTab(0); $('modal').style.display='flex';
}
function runTab(i){
  RUNTAB=i; $('tabintent').className='tabbtn'+(i?'':' on'); $('tabtpl').className='tabbtn'+(i?' on':'');
  $('runhint').textContent=i?'validated on import; runs unaided when tools are auto-approved':'one sentence; the LLM decomposes it into a DAG';
  $('rtext').value=i?JSON.stringify({nodes:[
    {id:"w",intent:"write welcome file",tool:"write_file",args:{path:"hello.txt",content:"hi from the harness\n"}},
    {id:"r",intent:"show the file",tool:"shell",args:{cmd:"cat hello.txt"},deps:["w"]}]},null,2)
    :'';
  $('rtext').placeholder=i?'':'describe the goal in one sentence, or click an example below';
  $('examples').style.display=i?'none':'flex';
}
async function submitRun(){
  const v=$('rtext').value.trim(); if(!v)return;
  let body;
  if(RUNTAB===0){ body={intent:v}; }
  else { try{body=JSON.parse(v);}catch(e){return alert('bad JSON');} }
  const r=await api('POST','/runs',body);
  $('modal').style.display='none'; await refreshRuns(); selRun(r.run_id);
}
function logLine(e){const t=e.ts?new Date(e.ts*1000).toLocaleTimeString():new Date().toLocaleTimeString();
  const d=document.createElement('div');d.className=e.level||'';d.textContent=`${t} [${e.kind||'-'}] ${e.sender||''}→${e.receiver||''} ${e.msg}`;
  $('log').prepend(d); while($('log').children.length>150)$('log').lastChild.remove();}
boot();
</script>
</body>
