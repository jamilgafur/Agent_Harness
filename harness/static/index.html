<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Harness</title>
<style>
  /* ---------------- design tokens ---------------- */
  :root {
    --bg:#0d1117; --panel:#131922; --panel2:#18202c; --inset:#0f141d;
    --line:#242d3a; --line2:#303b4b; --fg:#e8eef6; --dim:#97a3b2; --mut:#97a3b2;
    --acc:#5a9bff; --ok:#3fb950; --warn:#e3b341; --wait:#d29922; --err:#f85149; --violet:#bc4cf0;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.55 var(--sans);
         -webkit-font-smoothing:antialiased; }

  /* ---------------- header / chips ---------------- */
  header { display:flex; gap:10px; align-items:center; padding:0 14px; height:46px;
           border-bottom:1px solid var(--line); background:var(--panel);
           position:sticky; top:0; z-index:30; }
  .brand { font-size:12.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
           display:flex; align-items:center; gap:8px; margin-right:6px; }
  .brand .mark { width:9px; height:9px; border-radius:2px; background:var(--acc);
                 box-shadow:0 0 10px var(--acc); transform:rotate(45deg); }
  header .spacer { flex:1; }
  h1 { font-size:15px; margin:0; }
  .chip { padding:3px 11px; border-radius:999px; border:1px solid var(--line2); font-size:12px;
          color:var(--dim); font-family:var(--mono); background:var(--inset); white-space:nowrap;
          display:inline-flex; align-items:center; gap:5px; }
  .chip.attn { color:var(--warn); border-color:#e3b34166; background:#e3b34114; }

  /* ---------------- controls ---------------- */
  button, input, textarea, select { font:12.5px var(--sans); background:var(--inset); color:var(--fg);
    border:1px solid var(--line2); border-radius:7px; padding:6px 12px; }
  button { cursor:pointer; transition:border-color .12s, background .12s, transform .06s; }
  button:hover { border-color:var(--acc); } button:active { transform:translateY(1px); }
  button:disabled { opacity:.5; cursor:default; }
  input:focus, textarea:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px #5a9bff29; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#0b1524; font-weight:650; }
  button.ok { border-color:#3fb95099; color:var(--ok); font-weight:650; }
  button.ok:hover { background:#3fb9501f; border-color:var(--ok); }
  button.danger { border-color:#f8514977; color:var(--err); }
  button.danger:hover { background:#f8514914; border-color:var(--err); }
  textarea { width:100%; min-height:64px; font:12px/1.5 var(--mono); }
  .tabbtn.on { border-color:var(--acc); color:var(--acc); }
  #log, #detail, #tools .trow, #files, .chip { font-family:var(--mono); }

  /* ---------------- layout ---------------- */
  #layout { padding:10px 14px 14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:11px 13px; box-shadow:0 2px 8px #00000044; margin-bottom:10px; }
  .ptitle { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
            color:var(--dim); display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .ptitle .right { margin-left:auto; font-weight:400; letter-spacing:0; text-transform:none; }
  .rail3 { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .rail3 .panel { margin-bottom:0; background:var(--panel2); }
  @media (max-width:1150px){ .rail3 { grid-template-columns:1fr; } .rail3 .panel { margin-bottom:10px; } }
  #planbar { display:none; border-color:#e3b34155; border-left:3px solid var(--warn); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  details.dev summary, details.cmp summary { cursor:pointer; color:var(--dim); user-select:none; }
  details.dev[open] summary { margin-bottom:8px; }

  /* ---------------- canvas ---------------- */
  #viewport { position:relative; height:calc(100vh - 330px); min-height:400px;
              border:1px solid var(--line); border-radius:10px; overflow:hidden;
              background:radial-gradient(circle, #1b2430 1px, transparent 1px) 0 0/26px 26px, #0a0e13;
              cursor:grab; margin-bottom:10px; box-shadow:0 2px 8px #00000044; }
  #viewport:active { cursor:grabbing; }
  #canvas { position:absolute; inset:0; width:100%; height:100%; }

  /* ---------------- DAG nodes ---------------- */
  .node rect { fill:var(--panel2); stroke:#8b949e; stroke-width:1.4; rx:8; }
  .node text { fill:var(--fg); font-size:11px; pointer-events:none; font-family:var(--sans); }
  .node .sub { fill:var(--dim); font-size:9.5px; }
  .node { cursor:pointer; }
  .node.RUNNING rect { stroke:var(--acc); stroke-width:2; animation:pulse 1.4s infinite; }
  .node.DONE rect { stroke:var(--ok); } .node.PENDING rect { stroke:#8b949e; }
  .node.WAITING rect { stroke:var(--wait); } .node.REPAIRING rect { stroke:var(--warn); stroke-dasharray:5 3; }
  .node.FAILED rect, .node.BLOCKED rect { stroke:var(--err); }
  .node.ESCALATED rect { stroke:var(--violet); }
  .node.needsApproval rect { animation:flash 1s infinite; }
  @keyframes pulse { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:.35} }
  @keyframes flash { 0%,100%{stroke:var(--warn); stroke-width:1.8} 50%{stroke:#ffd757; stroke-width:4} }
  .nw.born { animation:pop .45s ease; }
  @keyframes pop { from { opacity:0; transform:scale(.55); } }
  .edge { fill:none; stroke:#3b4654; stroke-width:1.6; }
  .edge.done { stroke:#3fb95066; }
  .edge.born { stroke-dasharray:700; stroke-dashoffset:700; animation:dashin .6s ease forwards; }
  @keyframes dashin { to { stroke-dashoffset:0; } }
  .agent { pointer-events:none; }
  .agent circle { fill:var(--bg); stroke-width:2.2; }
  .agent text { fill:var(--fg); font-size:10px; font-weight:bold; }
  .agent .ph { font-size:9px; fill:var(--dim); }
  .agent.needhelp .q { fill:var(--warn); font-size:15px; font-weight:bold; }
  .trail { fill:none; stroke-width:2.4; pointer-events:none; opacity:.55; }
  .node .card { fill:var(--panel2); stroke:var(--line2); stroke-width:1.2; filter:drop-shadow(0 3px 6px #0007); rx:10; }
  .node:hover .card { stroke:var(--acc); }
  .node .rail { rx:3; }
  .node .port { fill:var(--bg); stroke:#6e7c8e; stroke-width:1.6; }
  .node .icon { font-size:19px; }
  .node .t1 { fill:var(--fg); font-size:11.5px; font-weight:650; }
  .node .t2 { fill:var(--fg); font-size:11px; opacity:.85; }
  .node .bdg circle { fill:var(--warn); }
  .node .bdg text { fill:#111; font-size:11px; font-weight:bold; }
  .node.DONE .rail { fill:var(--ok); } .node.DONE .port.out { fill:var(--ok); stroke:var(--ok); }
  .node.RUNNING .rail { fill:var(--acc); animation:railpulse 1.4s infinite; }
  .node.WAITING .rail { fill:var(--wait); }
  .node.REPAIRING .rail { fill:var(--warn); }
  .node.FAILED .rail, .node.BLOCKED .rail { fill:var(--err); }
  .node.ESCALATED .rail { fill:var(--violet); }
  .node.PENDING .rail { fill:#6e7c8e; }
  .node.RUNNING .card { stroke:var(--acc); }
  .node.needsApproval .card { animation:flash 1s infinite; }
  .node.needsApproval .bdg { animation:bob 1s infinite; }
  .resdot { fill:var(--ok); }
  .outnode { cursor:pointer; }
  .outnode .card { fill:#142018; stroke:#3fb95088; }
  .outnode:hover .card { stroke:var(--ok); }
  @keyframes railpulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }

  /* ---------------- run tabs ---------------- */
  #tabbar { display:flex; gap:4px; align-items:stretch; padding:0 14px; background:var(--panel);
            border-bottom:1px solid var(--line); position:sticky; top:46px; z-index:25; }
  .tab { display:inline-flex; align-items:center; gap:2px; border:1px solid transparent; border-bottom:none; background:transparent; color:var(--dim);
         border-radius:8px 8px 0 0; padding:8px 13px 7px; font-size:12.5px; max-width:320px;
         overflow:hidden; white-space:nowrap; cursor:pointer; }
  .tab:hover { color:var(--fg); background:var(--panel2); }
  .tab.on { color:var(--fg); background:var(--bg); border-color:var(--line); position:relative; margin-bottom:-1px; padding-bottom:8px; }
  .tab .tlabel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; display:inline-flex; align-items:center; }
  .tab .tdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; flex-shrink:0; }
  .tab .tdel { margin-left:10px; padding:0 6px; border-radius:6px; color:var(--err); opacity:.65; font-weight:bold; flex-shrink:0; }
  .tab .tdel:hover { opacity:1; background:#f8514926; }
  .tab.plus { color:var(--acc); font-size:15px; padding:2px 12px; align-self:center; }
  .dot.on { background:var(--ok); } .dot.off { background:#555; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }

  /* ---------------- log / inspector / tools / files ---------------- */
  #log { height:128px; overflow:auto; font-size:11.5px; background:var(--inset);
         border:1px solid var(--line); border-radius:7px; padding:6px 8px; }
  #log div { padding:1px 4px; border-radius:4px; }
  #log .warn { color:var(--warn); } #log .error { color:var(--err); }
  #detail { white-space:pre-wrap; font-size:11.5px; color:var(--dim); max-height:280px; overflow:auto; }
  .agrow { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .acard { border:1px solid var(--line); border-radius:7px; padding:6px 11px; min-width:150px; background:var(--inset); }
  #tools .trow { display:flex; gap:8px; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--line); font-size:12px; }
  #tools .trow:last-child { border-bottom:none; }
  #tools .tname { color:var(--fg); font-weight:600; }
  #tools .tmeta { color:var(--dim); font-size:11px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #tools .tag { font-size:10px; padding:1px 7px; border-radius:999px; border:1px solid var(--line2); color:var(--dim); flex-shrink:0; }
  #tools .tag.dyn { color:var(--violet); border-color:#bc4cf066; }
  label.f { display:block; margin-top:8px; font-size:11px; color:var(--mut); }
  label.f input, label.f textarea { margin-top:3px; }
  #files { max-height:120px; overflow:auto; margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }

  /* ---------------- modal ---------------- */
  #modal { position:fixed; inset:0; background:#060a10cc; backdrop-filter:blur(3px); display:none;
           align-items:center; justify-content:center; z-index:50; }
  #modal .card { width:min(760px,92vw); max-height:86vh; overflow:auto; border-radius:12px;
                 box-shadow:0 14px 44px #000b; }

  /* ---------------- toasts ---------------- */
  #toasts { position:fixed; right:14px; bottom:14px; z-index:80; display:flex;
            flex-direction:column; gap:8px; pointer-events:none; max-width:min(420px,92vw); }
  .toast { pointer-events:auto; display:flex; gap:9px; align-items:flex-start;
           background:var(--panel); border:1px solid var(--line2); border-left:3px solid var(--acc);
           border-radius:9px; padding:9px 12px; font-size:12.5px; color:var(--fg);
           box-shadow:0 8px 24px #0008; animation:toastin .25s ease; }
  .toast.ok { border-left-color:var(--ok); }
  .toast.warn { border-left-color:var(--warn); }
  .toast.error { border-left-color:var(--err); }
  .toast .tmsg { flex:1; line-height:1.45; word-break:break-word; }
  .toast .tx { cursor:pointer; color:var(--dim); padding:0 2px; }
  .toast .tx:hover { color:var(--fg); }
  @keyframes toastin { from { opacity:0; transform:translateY(8px); } }

  /* ---------------- new-run FAB ---------------- */
  #fab { position:fixed; right:18px; bottom:18px; z-index:40; border-radius:999px;
         padding:13px 20px; font-size:14px; font-weight:700; background:var(--acc);
         border-color:var(--acc); color:#0b1524; box-shadow:0 8px 24px #5a9bff55; }
  #fab:hover { background:#6ba6ff; border-color:#6ba6ff; }
  #toasts:not(:empty) ~ #fab { bottom:18px; }

  /* ---------------- settings ---------------- */
  .setrow { display:flex; align-items:center; gap:10px; justify-content:space-between;
            padding:9px 2px; border-bottom:1px solid var(--line); }
  .setrow:last-child { border-bottom:none; }
  .setrow .slabel { color:var(--fg); font-size:12.5px; }
  .setrow .shint { color:var(--dim); font-size:11px; margin-top:1px; }
  .setrow select, .setrow input[type=number] { min-width:110px; }
  .switch { position:relative; width:38px; height:20px; flex-shrink:0; }
  .switch input { opacity:0; width:0; height:0; }
  .switch .track { position:absolute; inset:0; background:var(--inset); border:1px solid var(--line2);
                   border-radius:999px; transition:background .15s; }
  .switch .track:before { content:""; position:absolute; width:14px; height:14px; border-radius:50%;
                          background:var(--dim); top:2px; left:3px; transition:.15s; }
  .switch input:checked + .track { background:var(--acc); border-color:var(--acc); }
  .switch input:checked + .track:before { transform:translateX(17px); background:#0b1524; }
  .setsec { margin:14px 0 4px; font-size:11px; font-weight:700; letter-spacing:.09em;
            text-transform:uppercase; color:var(--dim); }

  /* ---------------- light theme ---------------- */
  body[data-theme="light"] {
    --bg:#f4f6fa; --panel:#ffffff; --panel2:#f0f3f8; --inset:#eef1f6;
    --line:#d5dce4; --line2:#c2cbd6; --fg:#1d2733; --dim:#5b6a7a; --mut:#5b6a7a;
    --acc:#2563eb; --ok:#16a34a; --warn:#b45309; --wait:#b45309; --err:#dc2626; --violet:#9333ea;
  }
  body[data-theme="light"] #viewport { background:radial-gradient(circle, #d9dfe8 1px, transparent 1px) 0 0/26px 26px, #e9edf3; }
  body[data-theme="light"] .node rect { stroke:#8a97a8; }
  body[data-theme="light"] .node text { fill:var(--fg); }
  body[data-theme="light"] .edge { stroke:#a8b4c2; }
  body[data-theme="light"] .node .card { fill:var(--panel2); filter:drop-shadow(0 3px 5px #0002); }
  body[data-theme="light"] .outnode .card { fill:#e7f6ec; }
  body[data-theme="light"] .panel { box-shadow:0 2px 8px #00101818; }
  body[data-theme="light"] #log { background:var(--inset); }
  body[data-theme="light"] .chip { background:var(--inset); }
  body[data-theme="light"] .toast { box-shadow:0 8px 24px #0012; }
  body[data-theme="light"] #modal { background:#4a556766; }
  body[data-theme="light"] button.primary, body[data-theme="light"] #fab { color:#fff; }

  /* ---------------- reduced motion ---------------- */
  body.no-anim *, body.no-anim *:before, body.no-anim *:after {
    animation:none !important; transition:none !important; }

  /* ---------------- compact / mobile ---------------- */
  @media (max-width:760px){
    body { font-size:14px; }
    header { flex-wrap:wrap; height:auto; padding:6px 10px; row-gap:6px; }
    #tabbar { top:0; position:static; }
    .tab { max-width:200px; }
    #viewport { height:calc(100vh - 420px); min-height:300px; }
    #fab { right:12px; bottom:12px; padding:11px 16px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand"><span class="mark"></span>Agent Harness</span>
  <span class="chip" id="health">…</span>
  <span class="chip" id="attention"></span>
  <span class="chip" id="agentcount"></span>
  <span class="chip" id="metrics" title="task success · avg latency · delegation depth · first-pass"></span>
  <span class="spacer"></span>
  <span class="chip"><button onclick="fit()" title="recenter the graph">fit all</button><button onclick="zoom(1.25)" title="zoom in">+</button><button onclick="zoom(0.8)" title="zoom out">−</button></span>
  <button onclick="showSettings()" title="settings — theme, motion, budgets">⚙</button>
  <button onclick="showHelp()" title="how this works">ⓘ</button>
</header>

<div id="tabbar"><span id="tabs" style="display:flex;overflow-x:auto;flex:1"></span><button class="tab" onclick="showKnowledge()" title="accumulated knowledge tree of the selected run">knowledge</button><button class="tab" onclick="showOutput()" title="results of the selected run">output</button><button class="tab plus" onclick="newRun()" title="new run">＋</button></div>

<div id="layout">
  <div class="panel" id="planbar"></div>
  <div id="viewport"><svg id="canvas"><g id="world"></g><g id="agentlayer"></g></svg></div>

  <div class="rail3">
    <div class="panel">
      <div class="ptitle">Node inspector <span class="chip right" id="detailhint">click a node</span></div>
      <div id="detail"></div>
    </div>
    <div class="panel">
      <div class="ptitle">Tools &amp; skills <span class="right"><button onclick="loadTools()">refresh</button></span></div>
      <div id="tools"><span class="chip">loading…</span></div>
      <details class="cmp" style="margin-top:8px">
        <summary>＋ register a skill — usable at the next claim</summary>
        <label class="f">name<input id="sk_name" placeholder="count_lines" spellcheck="false"></label>
        <label class="f">description<input id="sk_desc" placeholder="count the lines of a workspace file"></label>
        <label class="f">required args (comma-separated)<input id="sk_args" placeholder="path" spellcheck="false"></label>
        <label class="f">shell template — {arg} placeholders<textarea id="sk_cmd" placeholder="wc -l < {path}" spellcheck="false" style="min-height:44px"></textarea></label>
        <div style="margin-top:8px;font-size:11px;color:var(--mut)">New skills land <i>unvetted</i>: first use shows a human an approval card.</div>
        <div class="row" style="margin-top:8px">
          <button class="ok" onclick="createSkill()">register skill</button>
          <span class="chip" id="skillhint"></span>
        </div>
      </details>
    </div>
    <div class="panel">
      <div class="ptitle">Workspace files <span class="right"><button onclick="loadFiles()">refresh</button> <span class="chip" id="filespath"></span></span></div>
      <div id="files"></div>
    </div>
  </div>

  <details class="panel dev"><summary>Developer — live agents &amp; event log</summary>
    <div class="agrow" id="agents"></div>
    <div class="ptitle">Events</div><div id="log"></div>
  </details>
</div>

<div id="modal"><div class="panel card"><div id="modalbody"></div></div></div>
<div id="toasts"></div>
<button id="fab" onclick="newRun()" title="start a new run">＋ New run</button>

<script>
// ---------- state ----------
let RUN=null, ALL={}, AGENTS={}, WS=null;      // ALL: run_id -> {intent,created,nodes,stats,active,pending:Set}
let FOREST={};                                  // run_id -> {pos:{nid:{x,y}}, yOff, h}  (set by draw)
const SEEN=new Set(), POSPREV={}, AGPOS={}, ANIM={};
let view={x:40,y:30,k:1}; const W=228,H=64,CW=320,RH=88;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- toasts ----------
let TOAST_N=0;
function toast(msg,kind='info',ms=4200){
  const box=$('toasts'); if(!box)return;
  const t=document.createElement('div'); t.className='toast '+kind; t.dataset.n=++TOAST_N;
  t.innerHTML=`<span class="tmsg">${msg}</span><span class="tx" title="dismiss">✕</span>`;
  t.querySelector('.tx').onclick=()=>t.remove();
  box.appendChild(t);
  while(box.children.length>4) box.firstChild.remove();
  setTimeout(()=>{ if(t.parentNode){ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),320);} }, ms);
}

// ---------- settings (persisted in localStorage) ----------
const SETDEF={theme:'dark',font:13,anim:true,devOpen:false,autoFit:true};
const UI={...SETDEF,...(JSON.parse(localStorage.getItem('harness_ui')||'{}'))};
function saveUI(patch){
  Object.assign(UI,patch);
  localStorage.setItem('harness_ui',JSON.stringify(UI));
  applyUI();
}
function applyUI(){
  document.body.dataset.theme=UI.theme;
  document.body.style.fontSize=UI.font+'px';
  document.body.classList.toggle('no-anim',!UI.anim);
  const dev=document.querySelector('details.dev'); if(dev) dev.open=!!UI.devOpen;
}
let POLICY={};   // server policy mirror (ws + /policy), used by settings panel

const api=async(m,p,b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({})); if(!r.ok){const e={level:'error',msg:`${m} ${p}: ${JSON.stringify(j.detail??j)}`};logLine(e);toast(esc(e.msg),'error',6000); throw new Error(r.status);} return j;};

// ---------- boot / ws ----------
async function boot(){
  applyUI();
  const h=await api('GET','/health'); $('health').textContent=`core ✓ · ollama ${h.ollama?'✓':'✗'} · ${h.agents} agents`;
  try{ POLICY=await api('GET','/policy'); }catch(e){}
  await refreshRuns(); ws(); loadFiles(); loadTools(); requestAnimationFrame(tick);
}
function ws(){
  const s=new WebSocket(`ws://${location.host}/ws`); WS=s;
  s.onmessage=ev=>{const m=JSON.parse(ev.data);
    if(m.type==='state'){ const r=ALL[m.run_id]||(ALL[m.run_id]={});
      r.nodes=m.nodes; r.stats=m.stats; r.active=m.active; r.pending=new Set(m.pending||[]);
      r.phase=m.phase; r.constraints=m.constraints||[]; r.plan_ready=m.plan_ready;
      r.prompts=m.prompts||{}; r.params=m.params||{}; r.warnings=m.warnings||[];
      drawTabs(); planBar(); attention(); if(m.run_id===RUN){draw(); filesMaybeRefresh(m.nodes);} }
    if(m.type==='agents'){AGENTS=m.agents; drawAgentsPanel(); attention();}
    if(m.type==='log'){ if(m.event.run_id===RUN) logLine(m.event); }
    if(m.type==='approval'){ attention(); const r=ALL[m.approval.run_id];
      if(r){ r.pending=r.pending||new Set();
        m.approval.status==='pending'?r.pending.add(m.approval.node_id):r.pending.delete(m.approval.node_id); draw(); } }
    if(m.type==='run'){ refreshRuns(); }
    if(m.type==='policy'){ POLICY=m.policy||{}; }
    if(m.type==='run_deleted'){ delete ALL[m.run_id]; if(RUN===m.run_id){RUN=null;$('detail').textContent='';} refreshRuns(); }
  };
  s.onclose=()=>setTimeout(ws,3000);
}
async function refreshRuns(){

    const s=await api('GET',`/runs/${r.id}`);
    ALL[r.id]={intent:r.intent,created:r.created,nodes:s.nodes,stats:s.stats,active:s.active,
               phase:s.phase,constraints:s.constraints||[],plan_ready:s.plan_ready,
               prompts:s.prompts||{},params:s.params||{},warnings:s.warnings||[],
               pending:new Set(s.pending||[])};
  }
  for(const id of Object.keys(ALL)) if(!ids.has(id)) delete ALL[id];
  if(!RUN&&runs[0]) RUN=runs[0].id;
  if(RUN&&!ALL[RUN]) RUN=runs[0]?runs[0].id:null;

// ---------- tidy tree layout (per run) ----------
function layoutRun(r){
  const nodes=Object.values(r.nodes||{}); if(!nodes.length)return {pos:{},h:0};
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const primary=n=>{ if(n.parent&&byId[n.parent])return n.parent;
    const d=n.deps||[]; return d.length&&byId[d[0]]?d[0]:null; };
  const kids={};
  nodes.forEach(n=>{const p=primary(n); if(p)(kids[p]=kids[p]||[]).push(n.id);});
  Object.values(kids).forEach(k=>k.sort());
  const roots=nodes.filter(n=>!primary(n)).map(n=>n.id).sort();
  const pos={}; let nextY=0;
  const place=(id,d)=>{
    const c=kids[id]||[]; let y;
    if(c.length){ const ys=c.map(ch=>place(ch,d+1)); y=(ys[0]+ys[ys.length-1])/2; }
    else { y=nextY*RH; nextY++; }
    pos[id]={x:d*CW,y}; return y;
  };
  roots.forEach(rid=>{place(rid,0); nextY+=0.6;});
  nodes.forEach(n=>{ if(!pos[n.id]){ pos[n.id]={x:(n.depth||0)*CW,y:nextY*RH}; nextY++; } });
  // a node never sits left of its inputs: push each one a column past its deepest
  // dep — converging "synthesis" wires become forward fan-in lanes, not loops
  for(let guard=0;guard<8;guard++){
    let moved=false;
    for(const n of nodes){
      const p=pos[n.id]; if(!p) continue;
      for(const d of n.deps||[]){
        const dp=pos[d];
        if(dp&&dp.x+CW>p.x){p.x=dp.x+CW;moved=true;}
      }
    }
    if(!moved)break;
  }
  return {pos,h:nextY*RH};
}

// ---------- n8n skin helpers ----------
const ICON=n=>n.type==='loop'?'⟳':!n.tool?'✦':n.tool.startsWith('mcp_')?'🔌'
  :({shell:'⌘',write_file:'📄',read_file:'📖',list_dir:'📁',web_search:'🔍',http_fetch:'🌐',llm:'✍️'}[n.tool]||'⚙️');
function clampTitle(s){ s=String(s||''); return [s.slice(0,24), s.length>24 ? s.slice(24,44)+(s.length>44?'…':'') : '']; }

// ---------- draw the selected run ----------
let DRAW_KEY='';
function draw(){
  const r=ALL[RUN];
  // dirty-check: skip the full innerHTML rebuild when nothing visible changed.
  // Key covers node set, states, attempts, results, hints, pending approvals and run.
  const nodes=r?r.nodes||{}:{};
  const key=(RUN||'')+'|'+Object.keys(nodes).length+'|'+
    Object.values(nodes).map(n=>n.state+(n.attempts||0)+(n.result!=null?1:0)+(n.hint?'!':'')).join('.')+
    '|'+[...((r&&r.pending)||[])].sort().join(',');
  if(key===DRAW_KEY)return;
  DRAW_KEY=key;
  let html=''; FOREST={};
  if(!r){
    html=`<text x="40" y="60" fill="#8b949e" font-size="14">no runs — hit ＋ to let the AI build one</text>`;
  } else {
    const {pos}=layoutRun(r); FOREST[RUN]={pos,yOff:0};
    for(const n of Object.values(r.nodes||{})){
      const deps=n.deps||[];
      deps.forEach((d,i)=>{
        const p0=pos[d],p1=pos[n.id]; if(!p0||!p1)return;
        const x0=p0.x+W,yy0=p0.y+H/2,x1=p1.x;
        // fan-in: each incoming dep lands on its own slot of the card's left edge
        const yy1=p1.y+H*(0.22+0.56*((i+1)/(deps.length+1)));
        const mx=Math.max(60,Math.abs(x1-x0)/2);
        const ekey=`${d}>${n.id}`, born=!SEEN.has(ekey); SEEN.add(ekey);
        html+=`<path class="edge ${r.nodes[d].state==='DONE'?'done':''} ${born?'born':''}" d="M${x0},${yy0} C${x0+mx},${yy0} ${x1-mx},${yy1} ${x1},${yy1}"/>`;
      });
    }
    for(const n of Object.values(r.nodes||{})){
      const p=pos[n.id]; if(!p)continue;
      const need=(r.pending||new Set()).has(n.id);
      const key=n.id, born=!SEEN.has(key); SEEN.add(key);
      const [t1,t2]=clampTitle(n.intent);
      html+=`<g class="node ${n.state} ${need?'needsApproval':''}" data-nid="${esc(n.id)}" transform="translate(${p.x},${p.y})"><g class="nw ${born?'born':''}">
        <rect class="card" width="${W}" height="${H}"/>
        <rect class="rail" x="0" y="0" width="6" height="${H}"/>
        <circle class="port in" cx="0" cy="${H/2}" r="5"/><circle class="port out" cx="${W}" cy="${H/2}" r="5"/>
        <text class="icon" x="22" y="${H/2+7}">${ICON(n)}</text>
        <text class="t1" x="54" y="24">${esc(t1)}</text>
        <text class="t2" x="54" y="38">${esc(t2)}</text>
        <text class="sub" x="54" y="54">${esc(n.tool||'abstract')} · ${n.state}${n.attempts>1?' ×'+n.attempts:''}${n.hint?' — ⚠ '+esc(n.hint.slice(0,16)):''}</text>
        ${need?`<g class="bdg"><circle cx="${W-16}" cy="6" r="10"/><text x="${W-16}" y="10" text-anchor="middle">!</text></g>`:''}
        ${n.result!=null?`<circle class="resdot" cx="${W-16}" cy="${need?26:6}" r="4" title="has output"/>`:''}
      </g></g>`;
    }
    // virtual RESULTS sink: the run's outputs as a first-class node on the DAG
    const produced=Object.values(r.nodes||{}).filter(n=>n.result!=null);
    const xs=Object.values(pos).map(p=>p.x);
    if(produced.length&&xs.length){
      const consumed=new Set(Object.values(r.nodes).flatMap(n=>[n.parent,...(n.deps||[])].filter(Boolean)));
      const sinks=Object.values(r.nodes).filter(n=>!consumed.has(n.id)&&n.result!=null);
      const ox=Math.max(...xs)+CW;
      const oys=sinks.map(n=>pos[n.id].y);
      const oy=oys.length?(Math.min(...oys)+Math.max(...oys))/2:0;
      FOREST[RUN].pos['$output']={x:ox,y:oy};
      const headAns=!!(r.nodes['root']&&r.nodes['root'].result&&r.nodes['root'].result.text);
      for(const s of sinks.filter(s=>s.id!=='root')){   // head wire would span the whole canvas
        const x0=pos[s.id].x+W,yy0=pos[s.id].y+H/2,mx=Math.max(60,(ox-x0)/2);
        html+=`<path class="edge done" d="M${x0},${yy0} C${x0+mx},${yy0} ${ox-mx},${oy+H/2} ${ox},${oy+H/2}"/>`;
      }
      html+=`<g class="node outnode" data-out="1" transform="translate(${ox},${oy})"><g class="nw">
        <rect class="card" width="${W}" height="${H}"/>
        <rect class="rail" x="0" y="0" width="6" height="${H}" style="fill:#3fb950"/>
        <circle class="port in" cx="0" cy="${H/2}" r="5"/>
        <text class="icon" x="22" y="${H/2+7}">📄</text>
        <text class="t1" x="54" y="24">RESULTS</text>

      </g></g>`;
    }
  }
  const world=$('world'); world.innerHTML=html;
  world.querySelectorAll('.node:not([data-out])').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();clickNode(el.dataset.nid);}));
  world.querySelectorAll('.node[data-out]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();showOutput();}));
  // FLIP: glide nodes that moved since last layout
  world.querySelectorAll('.node').forEach(el=>{
    const key=el.dataset.nid; if(!key)return;
    const m=/translate\(([-\d.e]+),([-\d.e]+)\)/.exec(el.getAttribute('transform')||'');
    if(!m)return; const nx=+m[1],ny=+m[2], prev=POSPREV[key];
    if(prev&&(Math.abs(prev.x-nx)>1||Math.abs(prev.y-ny)>1))
      el.animate([{transform:`translate(${prev.x}px,${prev.y}px)`},{transform:`translate(${nx}px,${ny}px)`}],
                 {duration:380,easing:'ease-in-out'});
    POSPREV[key]={x:nx,y:ny};
  });
  applyView();
}

// ---------- agents ride edges ----------
function cubicPt(p0,p1,s){
  const dx=Math.abs(p1.x-p0.x)/2+30, c1={x:p0.x+dx,y:p0.y}, c2={x:p1.x-dx,y:p1.y}, u=1-s;
  return {x:u*u*u*p0.x+3*u*u*s*c1.x+3*u*s*s*c2.x+s*s*s*p1.x,
          y:u*u*u*p0.y+3*u*u*s*c1.y+3*u*s*s*c2.y+s*s*s*p1.y};
}
function tick(){ drawAgents(); requestAnimationFrame(tick); }
function drawAgents(){
  const L=$('agentlayer'); if(!L)return;
  for(const [id,a] of Object.entries(AGENTS)){
    if(!a.node_id||!FOREST[a.run_id])continue;
    const f=FOREST[a.run_id], p=f.pos[a.node_id]; if(!p)continue;
    const t={x:p.x+W-34,y:p.y+f.yOff-24};
    const prev=AGPOS[id];
    if(!prev||Math.abs(prev.x-t.x)>1||Math.abs(prev.y-t.y)>1)
      ANIM[id]={p0:prev?{...prev}:t,p1:t,t0:performance.now(),dur:650};
  }
  for(const [id,an] of Object.entries(ANIM)){
    const e=Math.min(1,(performance.now()-an.t0)/an.dur), s=e<.5?2*e*e:-1+(4-2*e)*e;
    AGPOS[id]=e<1?cubicPt(an.p0,an.p1,s):{...an.p1};
    if(e>=1)delete ANIM[id];
  }
  const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
  L.innerHTML=Object.entries(AGENTS).map(([id,a])=>{
    const g=AGPOS[id]; if(!g)return '';
    const an=ANIM[id]; let trail='';
    if(an){ const e=Math.min(1,(performance.now()-an.t0)/an.dur), s2=Math.max(0,(e<.5?2*e*e:-1+(4-2*e)*e)-0.14);
      const b=cubicPt(an.p0,an.p1,s2);
      trail=`<line class="trail" x1="${b.x+14}" y1="${b.y+14}" x2="${g.x+14}" y2="${g.y+14}" style="stroke:hsl(${hue(id)},70%,55%)"/>`; }
    const need=a.node_id&&ALL[a.run_id]&&(ALL[a.run_id].pending||new Set()).has(a.node_id);
    return `${trail}<g class="agent ${need?'needhelp':''}" style="transform:translate(${g.x}px,${g.y}px)">
      <circle cx="14" cy="14" r="13" style="stroke:${a.alive?`hsl(${hue(id)},70%,55%)`:'#555'}"/>
      <text x="14" y="18" text-anchor="middle">${esc(id.replace(/^agent-?/,'')[0]||'A').toUpperCase()}</text>
      ${need?'<text class="q" x="24" y="4">?</text>':`<text class="ph" x="28" y="20">${esc(a.phase.slice(0,12))}</text>`}</g>`;
  }).join('');
}

    `<div class="acard"><span class="dot ${a.alive?'on':'off'}"></span><b>${esc(id)}</b>
     <div class="sub">${esc(a.phase)} ${a.node_id?'@ '+esc(a.node_id):''}</div>

let ATT_T=null;
function attention(){

async function _attention(){

    : '⚑ 0 need you';
  $('attention').className='chip'+(total?' attn':'');
  $('attention').style.cursor=total?'pointer':'default';

let drag=null;
const vp=$('viewport');
vp.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};vp.setPointerCapture(e.pointerId);});
vp.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+(e.clientX-drag.x);view.y=drag.vy+(e.clientY-drag.y);applyView();});
vp.addEventListener('pointerup',()=>drag=null);
vp.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:0.89;zoomAt(f,e.offsetX,e.offsetY);},{passive:false});
function zoomAt(f,cx,cy){const k2=Math.min(3,Math.max(.15,view.k*f));view.x=cx-(cx-view.x)*k2/view.k;view.y=cy-(cy-view.y)*k2/view.k;view.k=k2;applyView();}
function zoom(f){zoomAt(f,vp.clientWidth/2,vp.clientHeight/2);}
function applyView(){$('world').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);$('agentlayer').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function fit(){
  const f=FOREST[RUN]; if(!f)return;
  const xs=[],ys=[];
  for(const p of Object.values(f.pos)){xs.push(p.x);ys.push(p.y);}
  if(!xs.length)return;
  const x0=Math.min(...xs),x1=Math.max(...xs)+W,y0=Math.min(...ys)-30,y1=Math.max(...ys)+H;
  view.k=Math.min(1.3,vp.clientWidth/(x1-x0+60),vp.clientHeight/(y1-y0+40));
  view.x=vp.clientWidth/2-(x0+x1)/2*view.k;
  view.y=vp.clientHeight/2-(y0+y1)/2*view.k;
  applyView();
}

// ---------- result rendering ----------
function renderResult(v){
  if(v==null) return '';
  if(typeof v!=='object') return String(v);
  if(Array.isArray(v.results)&&v.results.length&&v.results[0]&&v.results[0].url!==undefined)
    return v.results.map(x=>`${x.page_text?'📖 page read:':'🔗 link only:'} ${x.title||x.url}\n  ${x.url}`).join('\n');
  if(v.content!==undefined) return String(v.content).slice(0,1500);
  if(v.stdout!==undefined) return (v.stdout+(v.stderr?'\n[stderr] '+v.stderr:'')).slice(0,1500)||'(empty output)';
  if(v.text) return v.text.slice(0,1500);
  if(v.bytes!==undefined) return `wrote ${v.bytes} bytes`;
  if(Object.keys(v).length&&Object.values(v).every(x=>x&&typeof x==='object'))
    return Object.entries(v).map(([k,x])=>`── ${k} ──\n${renderResult(x)}`).join('\n\n').slice(0,2500);
  return JSON.stringify(v,null,1).slice(0,1500);
}

let LASTOUT='';
function headText(r){
  const nodes=r.nodes||{};
  const root=nodes['root'];
  if(root&&root.result&&root.result.text) return root.result.text;   // head owns the answer
  const consumed=new Set(Object.values(nodes).flatMap(n=>[n.parent,...(n.deps||[])].filter(Boolean)));
  const texts=Object.values(nodes).filter(n=>!consumed.has(n.id)&&n.result&&n.result.text);
  if(texts.length) return texts.sort((a,b)=>b.result.text.length-a.result.text.length)[0].result.text;
  return '';
}
// tiny markdown renderer for the assembled head document (escapes first, then marks up)
function mdLite(s){
  let h=esc(s||'');
  h=h.replace(/^### (.*)$/gm,(m,t)=>`<div style="font-weight:bold;margin:10px 0 2px">${t}</div>`);
  h=h.replace(/^## (.*)$/gm,(m,t)=>`<div style="font-weight:bold;font-size:14.5px;margin:16px 0 4px;color:var(--acc)">${t}</div>`);
  h=h.replace(/^# (.*)$/gm,(m,t)=>`<div style="font-weight:bold;font-size:17px;margin:4px 0 10px">${t}</div>`);
  h=h.replace(/\*\*([^*\n]+)\*\*/g,(m,t)=>`<b>${t}</b>`);
  h=h.replace(/^- (https?:\S+?)(&amp;\S+)?(\s*)$/gm,(m,u,a)=>`• <a href="${u+(a||'')}" target="_blank" rel="noopener" style="color:var(--acc)">${u}${a||''}</a>`);
  h=h.replace(/^- (?!\s*<a)(.*)$/gm,'• $1');
  return h;
}
function ktree(k,d){
  const rows=(k.children||[]).map(c=>ktree(c,d+1)).join('');
  const own=k.chars?`<span style="color:var(--mut);font-size:11px">${k.chars}ch</span>
    <div style="color:var(--mut);white-space:pre-wrap;font-size:11.5px">${esc(k.text||'').slice(0,240)}</div>`:'';
  return `<div style="margin-left:${d*18}px;border-left:${d?'1px solid var(--line)':'none'};padding:3px 8px">
    <b style="font-size:12px">${esc(k.id)}</b> · ${esc(k.intent||'')} ${own}</div>`+rows;
}

async function decide(id,ok){
  let args;
  const ta=$('modargs');
  if(ok){ try{args=JSON.parse(ta.value);}catch(e){return alert('bad JSON');} }
  const body = ok ? {decision:'approve',args} : {decision:'reject'};
  const r=await api('POST',`/approvals/${id}`,body);
  logLine({level:r.status==='done'?'info':'warn',msg:`approval ${id}: ${r.status}`});
  toast(ok?'✔ approved — the agent continues':'✖ rejected — the agent rethinks', ok?'ok':'warn');
  $('modal').style.display='none'; attention();
}

    ${setRow('max agents','parallel workers (1–32)',`<input id="set_agents" type="number" min="1" max="32" value="${p.max_agents??''}">`)}
    ${setRow('max LLM calls / run','budget governor limit',`<input id="set_llm" type="number" min="10" max="100000" value="${p.max_llm_calls??''}">`)}
    ${setRow('max seconds / run','wall-clock budget',`<input id="set_secs" type="number" min="60" max="86400" value="${p.max_seconds??''}">`)}
    ${setRow('max repairs / node','before escalation',`<input id="set_repairs" type="number" min="1" max="10" value="${p.max_repairs??''}">`)}
    ${setRow('confirm actions','approval cards for tools not auto-approved',`<label class="switch"><input id="set_confirm" type="checkbox" ${p.confirm_actions?'checked':''}><span class="track"></span></label>`)}
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="saveSettings()">save limits</button>
      <button onclick="resetSettings()">reset appearance</button>
      <button onclick="$('modal').style.display='none'">close</button>
      <span class="chip" id="sethint"></span></div>`;
  $('modal').style.display='flex';
  $('set_theme').onchange=e=>saveUI({theme:e.target.value});
  $('set_font').onchange=e=>saveUI({font:Math.min(18,Math.max(10,+e.target.value||13))});
  $('set_anim').onchange=e=>saveUI({anim:e.target.checked});
  $('set_autofit').onchange=e=>saveUI({autoFit:e.target.checked});
  $('set_dev').onchange=e=>saveUI({devOpen:e.target.checked});
}
async function saveSettings(){
  const patch={max_agents:+$('set_agents').value,max_llm_calls:+$('set_llm').value,
               max_seconds:+$('set_secs').value,max_repairs:+$('set_repairs').value,
               confirm_actions:$('set_confirm').checked};
  try{
    POLICY=await api('POST','/policy',patch);
    $('sethint').textContent='✓ saved — applies to new work immediately';
    toast('✓ resource limits saved','ok');
  }catch(e){ $('sethint').textContent='rejected by server'; }
}
function resetSettings(){ saveUI({...SETDEF}); toast('appearance reset to defaults','ok'); }

// ---------- new run ----------
let RUNTAB=0;
function newRun(){
  $('modalbody').innerHTML=`<b>new run</b>
    <div class="row" style="margin:8px 0"><button class="tabbtn on" id="tabintent" onclick="runTab(0)">intent (LLM decomposes)</button><button class="tabbtn" id="tabtpl" onclick="runTab(1)">template DAG</button></div>
    <textarea id="rtext" style="min-height:150px"></textarea>
    <div class="row" id="examples" style="margin-top:6px">
      <button onclick="$('rtext').value=this.dataset.v" data-v="tell me about the difference between structured and unstructured pruning of neural networks">tell me about pruning</button>
      <button onclick="$('rtext').value=this.dataset.v" data-v="write a short research paper on mixture-of-experts routing in transformers, with references">research paper on MoE</button>
      <button onclick="$('rtext').value=this.dataset.v" data-v="research the main approaches to LLM quantization and write a summary with comparisons">LLM quantization survey</button>
    </div>
    <div class="row" style="margin-top:8px"><button onclick="submitRun()">create run</button><button onclick="$('modal').style.display='none'">cancel</button>
    <span class="chip" id="runhint"></span></div>`;
  runTab(0); $('modal').style.display='flex';
}
function runTab(i){
  RUNTAB=i; $('tabintent').className='tabbtn'+(i?'':' on'); $('tabtpl').className='tabbtn'+(i?' on':'');
  $('runhint').textContent=i?'validated on import; runs unaided when tools are auto-approved':'one sentence; the LLM decomposes it into a DAG';
  $('rtext').value=i?JSON.stringify({nodes:[
    {id:"w",intent:"write welcome file",tool:"write_file",args:{path:"hello.txt",content:"hi from the harness\n"}},
    {id:"r",intent:"show the file",tool:"shell",args:{cmd:"cat hello.txt"},deps:["w"]}]},null,2)
    :'';
  $('rtext').placeholder=i?'':'describe the goal in one sentence, or click an example below';
  $('examples').style.display=i?'none':'flex';
}
async function submitRun(){
  const v=$('rtext').value.trim(); if(!v)return;
  let body;
  if(RUNTAB===0){ body={intent:v}; }
  else { try{body=JSON.parse(v);}catch(e){return alert('bad JSON');} }
  const r=await api('POST','/runs',body);
  $('modal').style.display='none';
  toast(`✓ run ${esc(r.run_id)} created — ${RUNTAB===0?'agents are planning it now':'running the template'}`,'ok');
  await refreshRuns(); selRun(r.run_id);
}
let LAST_ERR_TOAST='';
function logLine(e){const t=e.ts?new Date(e.ts*1000).toLocaleTimeString():new Date().toLocaleTimeString();
  const d=document.createElement('div');d.className=e.level||'';d.textContent=`${t} [${e.kind||'-'}] ${e.sender||''}→${e.receiver||''} ${e.msg}`;
  $('log').prepend(d); while($('log').children.length>150)$('log').lastChild.remove();
  // surface failures as toasts too (deduped) — budget kills escalations must not hide in a log
  if(e.level==='error'&&e.msg&&e.msg!==LAST_ERR_TOAST){LAST_ERR_TOAST=e.msg;toast('⛔ '+esc(e.msg),'error',7000);}}
boot();
</script>
